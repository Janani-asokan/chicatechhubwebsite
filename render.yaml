services:
  - type: web
    name: chicatechhub
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false # Neon Postgres connection string (paste in Render dashboard)
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false # you enter this yourself in the Render dashboard
      - key: NOTIFY_WEBHOOK_URL
        sync: false # optional: Discord/Slack webhook for new-enquiry alerts

